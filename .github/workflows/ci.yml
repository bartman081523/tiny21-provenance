name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # the axis maths lives in the sibling package (same author)
          pip install "git+https://github.com/bartman081523/provenance-audit.git"
      - name: tests
        run: python -m pytest tests -q

  dos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mtools
        run: sudo apt-get update && sudo apt-get install -y mtools
      - name: cache OpenWatcom
        id: owcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ow
          key: ow-snapshot-v2
      - name: fetch OpenWatcom (cross compiler, DOS target)
        if: steps.owcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ow"
          curl -sSL -o "$RUNNER_TEMP/ow.tar.xz" \
            "https://github.com/open-watcom/open-watcom-v2/releases/download/Last-CI-build/ow-snapshot.tar.xz"
          tar -xf "$RUNNER_TEMP/ow.tar.xz" -C "$RUNNER_TEMP/ow"
      - name: build TINY_PROV.EXE
        env:
          OW: ${{ runner.temp }}/ow
        run: ./dos-ui/build.sh
      - name: check the build
        run: |
          ls -l dos/TINY_PROV.EXE
          sha256sum dos/TINY_PROV.EXE | tee TINY_PROV.EXE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TINY_PROV
          path: |
            dos/TINY_PROV.EXE
            dos/PROV.H
            TINY_PROV.EXE.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, dos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TINY_PROV
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TINY_PROV.EXE
            dist/PROV.H
            dist/TINY_PROV.EXE.sha256
          generate_release_notes: true
